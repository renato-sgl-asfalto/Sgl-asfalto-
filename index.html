// ── Firestore helpers ────────────────────────────────────────────────
// Projetos: coleção "projetos" — cada doc = um projeto
// Ensaios:  coleção "ensaios"  — cada doc = um ensaio

async function sg(key) {
  try {
    if (key === "sglaa_projetos_v1") {
      const snap = await getDocs(collection(db, "projetos"));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    if (key === "sglaa_ensaios_v2") {
      const snap = await getDocs(collection(db, "ensaios"));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    return null;
  } catch(e) { console.error("sg error",e); return null; }
}

async function ss(key, value) {
  try {
    if (key === "sglaa_projetos_v1") {
      // value é array de projetos — salva/atualiza cada um pelo id
      const arr = Array.isArray(value) ? value : [];
      for (const p of arr) {
        await setDoc(doc(db, "projetos", p.id), p);
      }
      // Remove projetos que foram deletados (não estão mais no array)
      const snap = await getDocs(collection(db, "projetos"));
      const ids = arr.map(p => p.id);
      for (const d of snap.docs) {
        if (!ids.includes(d.id)) await deleteDoc(doc(db, "projetos", d.id));
      }
    }
  } catch(e) { console.error("ss error",e); }
}

async function saveEnsaio(ens) {
  try {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    const entry = { ...ens, id, savedAt: new Date().toISOString(), data: new Date().toISOString() };
    await setDoc(doc(db, "ensaios", id), entry);
  } catch(e) { console.error("saveEnsaio error",e); throw e; }
}

async function delEnsaio(id) {
  try {
    await deleteDoc(doc(db, "ensaios", id));
  } catch(e) { console.error("delEnsaio error",e); }
}

function avalia(v,min,max){
  const vn=parseFloat(v);
  if(isNaN(vn)||v===""||v===null) return "pend";
  if(min!==""&&min!==null&&min!==undefined&&vn<parseFloat(min)) return "nc";
  if(max!==""&&max!==null&&max!==undefined&&vn>parseFloat(max)) return "nc";
  return "ok";
}

        <div style={{fontSize:10,color:T.dim,marginBottom:8}}>Estes valores serão usados como critérios de conformidade nos ensaios</div>

        <Divider label="Parâmetros Volumétricos"/>

        <Row>
          {[
            {l:"Estabilidade — Mín (kgf)",k:"estab_min",ph:"500"},{l:"Estabilidade — Máx (kgf)",k:"estab_max",ph:""},
            {l:"Fluência — Mín (×0,25mm)",k:"fluencia_min",ph:""},{l:"Fluência — Máx (×0,25mm)",k:"fluencia_max",ph:""},

            <FL key={k} label={l} w="180px">
              <input type="number" step="0.01" value={p[k]} onChange={e=>set(k,e.target.value)} placeholder={ph}/>

        <Divider label="Parâmetros de Agregados"/>
        <Row>
          {[
            {l:"Equiv. Areia — Mín (%)",k:"eq_areia_min",ph:"55"},
            {l:"Abrasão L.A. — Máx (%)",k:"abrasao_max",ph:"50"},
            {l:"Índice de Forma — Mín",k:"indice_forma_min",ph:"0.5"},
          ].map(({l,k,ph})=>(
            <FL key={k} label={l} w="180px">
              <input type="number" step="0.01" value={p[k]} onChange={e=>set(k,e.target.value)} placeholder={ph}/>
            </FL>
          ))}
        </Row>
      </Card>

      {/* ─── 6. FAIXA GRANULOMÉTRICA ─── */}
      <Card style={{marginBottom:10}}>
        <ST c={T.accent} mb={10}>6. Faixa Granulométrica de Trabalho</ST>
        <Row style={{marginBottom:10}}>
          <FL label="Faixa DNIT 031 (referência)" w="200px">
            <select value={p.faixaDNIT} onChange={e=>set("faixaDNIT",e.target.value)}>
              {["A-25","B-19","C-12.5","D-9.5"].map(f=><option key={f}>{f}</option>)}
            </select>
          </FL>
          <FL label="Usar limites próprios do projeto?" w="220px">
            <select value={p.usarFaixaProjeto?"sim":"nao"} onChange={e=>set("usarFaixaProjeto",e.target.value==="sim")}>
              <option value="sim">Sim — digitar min/máx por peneira</option>
              <option value="nao">Não — usar faixa DNIT</option>
            </select>
          </FL>
        </Row>

        <div style={{overflowX:"auto"}}>
          <table>
            <thead>
              <tr>
                <th>Peneira</th>
                <th>% Pass. Projeto (curva base)</th>
                {p.usarFaixaProjeto&&<th>Mín % Pass. (projeto)</th>}
                {p.usarFaixaProjeto&&<th>Máx % Pass. (projeto)</th>}
                <th>Faixa DNIT {p.faixaDNIT}</th>
              </tr>
            </thead>
            <tbody>
              {PEN.filter(pen=>pen.id!=="fundo").map(pen=>{
                const fp=p.faixaProjeto[pen.id]||{};
                const fxDnit=FAIXAS_DNIT[p.faixaDNIT]?.[pen.dnit];
                return(
                  <tr key={pen.id}>
                    <td style={{color:T.text,fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{pen.lb}</td>

                      <td><input type="number" step="0.1" value={fp.min||""} onChange={e=>setFaixa(pen.id,"min",e.target.value)} style={{width:80}} placeholder="mín"/></td>
                    )}
                    {p.usarFaixaProjeto&&(
                      <td><input type="number" step="0.1" value={fp.max||""} onChange={e=>setFaixa(pen.id,"max",e.target.value)} style={{width:80}} placeholder="máx"/></td>

                    </td>

                );

            </tbody>
          </table>
        </div>
      </Card>

      {/* ─── 7. OBS ─── */}
      <Card style={{marginBottom:12}}>
        <FL label="Observações do Projeto">
          <textarea rows={2} value={p.obs} onChange={e=>set("obs",e.target.value)} placeholder="Notas, restrições, ensaios adicionais exigidos..."/>
        </FL>
      </Card>

      <Row gap={8}>
        <Btn onClick={()=>onSalvar(p)} bg={T.accent} style={{flex:1,fontSize:14,padding:"10px"}}>
          💾 Salvar Projeto de Mistura
        </Btn>
        {onCancelar&&<Btn onClick={onCancelar} bg={T.surface} tc={T.dim} style={{border:`1px solid ${T.border}`}}>Cancelar</Btn>}
      </Row>
    </div>
  );
}

// EXTRAÇÃO + GRANULOMETRIA (usa limites do projeto)
// ══════════════════════════════════════════════════════════════════════
function ExtrGranuloCalc({proj,onSaved}){
  const [massaMist,setMM]=useState("");
  const [kf,setKf]=useState("0");
  const [metodo,setMet]=useState("Soxhlet (DNIT 158-ME)");
  const [pesos,setPesos]=useState({});
  const [trecho,setTrecho]=useState("");
  const [lote,setLote]=useState("");
  const [tecnico,setTecnico]=useState("");
  const setPeso=(id,v)=>setPesos(p=>({...p,[id]:v}));

  const somaRetidos=PEN.reduce((s,p)=>s+nv(pesos[p.id]),0);
  const massaAgg=somaRetidos;
  const pb=massaMist&&massaAgg>0?((nv(massaMist)-massaAgg)/nv(massaMist)*100)+nv(kf):null;
  const projPb=nv(proj?.teorcapOtimo);
  const desvio=pb!=null&&projPb>0?pb-projPb:null;
  const confCap=desvio!=null?Math.abs(desvio)<=0.3:null;

  // Granulometria
  const calcGran=()=>{
    if(massaAgg<=0) return null;
    let retAcum=0; const rows=[];
    for(const pen of PEN){
      const ret=nv(pesos[pen.id]);
      retAcum+=ret;
      const pRI=massaAgg>0?(ret/massaAgg)*100:0;
      const pRA=massaAgg>0?(retAcum/massaAgg)*100:0;
      const pP=100-pRA;
      rows.push({...pen,ret,pRI,pRA,pP});
    }
    const soma=rows.reduce((s,r)=>s+r.ret,0);
    const perdaPct=massaAgg>0?(Math.abs(massaAgg-soma)/massaAgg)*100:0;
    return {rows,perdaPct,ok:perdaPct<=0.3};
  };
  const gran=calcGran();

  // Limites por peneira — usa faixa do projeto se configurada, senão DNIT
  const getLim=(penId,dnit)=>{
    if(proj?.usarFaixaProjeto){
      const fp=proj.faixaProjeto?.[penId];
      if(fp&&(fp.min!==""||fp.max!=="")) return {min:fp.min,max:fp.max,tipo:"projeto"};
    }
    const fxd=proj?.faixaDNIT||"B-19";
    const lDnit=FAIXAS_DNIT[fxd]?.[dnit];
    if(lDnit==null) return null;
    return Array.isArray(lDnit)?{min:lDnit[0],max:lDnit[1],tipo:"DNIT"}:{min:lDnit,max:lDnit,tipo:"DNIT"};
  };

  const checkPen=(pP,lim)=>{
    if(!lim) return null;
    const mn=lim.min!==""&&lim.min!==undefined?parseFloat(lim.min):null;
    const mx=lim.max!==""&&lim.max!==undefined?parseFloat(lim.max):null;
    if(mn!==null&&pP<mn) return false;
    if(mx!==null&&pP>mx) return false;
    return true;
  };

  const ncsGran=gran?gran.rows.filter(r=>{
    const lim=getLim(r.id,r.dnit);
    return checkPen(r.pP,lim)===false;
  }):[];

  return(
    <div>
      {!proj&&(
        <div style={{padding:"10px 14px",background:T.orangeB,border:`1px solid ${T.orange}40`,borderRadius:6,marginBottom:12,fontSize:11,color:T.orange}}>
          ⚠ Nenhum projeto selecionado. Os limites de controle não serão aplicados. Selecione um projeto na aba "Projetos".
        </div>
      )}
      {proj&&(
        <div style={{padding:"8px 12px",background:`${T.accent}10`,border:`1px solid ${T.accent}30`,borderRadius:6,marginBottom:12,fontSize:11,color:T.dim}}>
          <strong style={{color:T.accent}}>{proj.codigo}</strong> — {proj.nome} &nbsp;·&nbsp;
          Teor ótimo: <strong style={{color:T.accent}}>{proj.teorcapOtimo}%</strong> &nbsp;·&nbsp;
          Faixa: <strong style={{color:T.text}}>{proj.faixaDNIT}</strong>
          {proj.usarFaixaProjeto&&" (limites do projeto)"}
        </div>
      )}

      {/* Extração */}
      <div style={{border:`1px solid ${T.accent}40`,borderRadius:8,padding:12,marginBottom:12,background:`${T.accent}06`}}>
        <ST c={T.accent} mb={8}>🛢 Extração do Ligante — DNIT 158-ME / ASTM D6307</ST>
        <Row>
          <FL label="Método" w="210px">
            <select value={metodo} onChange={e=>setMet(e.target.value)}>
              <option>Soxhlet (DNIT 158-ME)</option>
              <option>Ignição / Forno (ASTM D6307)</option>
              <option>Centrífuga (DNER ME-053)</option>
            </select>
          </FL>
          <FL label="Massa da Mistura Asfáltica (g)" w="210px">
            <input type="number" step="0.1" value={massaMist} onChange={e=>setMM(e.target.value)} placeholder="Ex: 1200.0"/>
          </FL>
          <FL label="Fator de Correção kf (%)" w="160px">
            <input type="number" step="0.001" value={kf} onChange={e=>setKf(e.target.value)} placeholder="0.000"/>
          </FL>
        </Row>
        {/* Resultado extração */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:7,marginTop:8}}>
          {[
            {l:"Massa Mistura",v:massaMist?fmt(nv(massaMist),2)+" g":"—",c:T.text},
            {l:"Massa Agregados (Σ peneiras)",v:massaAgg>0?fmt(massaAgg,2)+" g":"aguardando...",c:massaAgg>0?T.accent:T.muted},
            {l:"Teor CAP Pb",v:pb!=null?fmt(pb,3)+"%":"—",c:pb!=null?(confCap?T.green:T.red):T.muted},
            {l:"Desvio (tol. ±0,3%)",v:desvio!=null?(desvio>0?"+":"")+fmt(desvio,3)+"%":"—",c:confCap!=null?(confCap?T.green:T.red):T.muted},
          ].map(({l,v,c})=>(
            <div key={l} style={{background:T.surface,padding:"7px 9px",borderRadius:4,borderLeft:`3px solid ${c}`}}>
              <div style={{fontSize:9,color:T.muted,marginBottom:2}}>{l}</div>
              <div style={{fontFamily:"'Share Tech Mono'",fontSize:13,fontWeight:700,color:c}}>{v}</div>
            </div>
          ))}
          {pb!=null&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"7px 9px"}}>
            <Sb s={confCap?"ok":"nc"}/>
            {proj&&<span style={{fontSize:9,color:T.muted}}>Projeto: {proj.teorcapOtimo}%</span>}
          </div>}
        </div>
      </div>

      {/* Granulometria */}
      <div style={{border:`1px solid ${T.green}40`,borderRadius:8,padding:12,background:`${T.green}05`}}>
        <ST c={T.green} mb={8}>📐 Granulometria dos Agregados — DNIT 412/2025-ME</ST>
        <div style={{fontSize:10,color:T.dim,marginBottom:8,background:T.surface,padding:"5px 9px",borderRadius:4}}>
          Pese o retido em cada peneira · A soma alimenta automaticamente o Pb acima
          {massaAgg>0&&<span style={{color:T.green}}> · M.agg = {fmt(massaAgg,2)} g</span>}
          {proj&&<span style={{color:T.dim}}> · Comparando contra faixa: <strong style={{color:T.text}}>{proj.usarFaixaProjeto?"projeto próprio":proj.faixaDNIT+" (DNIT)"}</strong></span>}
        </div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead>
              <tr>
                <th>Peneira</th>
                <th>Retido (g)</th>
                <th>% Ret. Ind.</th>
                <th>% Ret. Acum.</th>
                <th style={{color:T.text}}>% Passante</th>
                <th>Limite Mín.</th>
                <th>Limite Máx.</th>
                <th>Fonte</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody>
              {PEN.map(pen=>{
                const row=gran?.rows.find(r=>r.id===pen.id);
                const lim=getLim(pen.id,pen.dnit);
                const passOk=row&&lim?checkPen(row.pP,lim):null;
                return(
                  <tr key={pen.id} style={{background:passOk===false?`${T.redB}80`:"transparent"}}>
                    <td style={{color:T.text,fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{pen.lb}</td>
                    <td>
                      <input type="number" step="0.01" value={pesos[pen.id]||""}
                        onChange={e=>setPeso(pen.id,e.target.value)}
                        style={{width:90,padding:"3px 5px",fontSize:11}} placeholder="0.00"/>
                    </td>
                    <td style={{color:T.dim,fontFamily:"'Share Tech Mono'"}}>{row?fmt(row.pRI,2):"-"}</td>
                    <td style={{color:T.dim,fontFamily:"'Share Tech Mono'"}}>{row?fmt(row.pRA,2):"-"}</td>
                    <td style={{color:passOk===false?T.red:passOk===true?T.green:T.text,fontWeight:700,fontFamily:"'Share Tech Mono'",fontSize:12}}>
                      {row?fmt(row.pP,2):"-"}
                    </td>
                    <td style={{color:T.muted,fontSize:10}}>{lim?.min!==""&&lim?.min!==undefined?lim.min+"%":"-"}</td>
                    <td style={{color:T.muted,fontSize:10}}>{lim?.max!==""&&lim?.max!==undefined?lim.max+"%":"-"}</td>
                    <td style={{fontSize:9}}>
                      {lim&&<span className={`badge ${lim.tipo==="projeto"?"conf":"pend"}`} style={{fontSize:8}}>
                        {lim.tipo==="projeto"?"PROJ":"DNIT"}
                      </span>}
                    </td>
                    <td>
                      {passOk===true&&<span className="badge conf">✓ OK</span>}
                      {passOk===false&&<span className="badge nconf">✗ NC</span>}
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:T.surface,borderTop:`2px solid ${T.border}`}}>
                <td style={{fontWeight:700,color:T.text}}>TOTAL</td>
                <td style={{fontFamily:"'Share Tech Mono'",fontWeight:700,color:T.accent}}>{somaRetidos>0?fmt(somaRetidos,2)+" g":"—"}</td>
                <td colSpan={3} style={{color:T.muted,fontSize:10}}>
                  {massaMist&&somaRetidos>0&&`CAP extraído: ${fmt(nv(massaMist)-somaRetidos,2)} g`}
                </td>
                <td colSpan={4}>
                  {gran&&<span style={{color:gran.ok?T.green:T.red,fontWeight:700,fontSize:11}}>
                    {gran.ok?`✓ Perda: ${fmt(gran.perdaPct,3)}%`:`⚠ Perda: ${fmt(gran.perdaPct,3)}% — acima de 0,3%`}
                  </span>}
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        {/* NCs resumo */}
        {ncsGran.length>0&&(
          <div style={{marginTop:8,padding:"7px 10px",background:T.redB,borderRadius:4,border:`1px solid ${T.red}40`}}>
            <div style={{fontSize:10,color:T.red,fontWeight:700,marginBottom:4}}>
              {ncsGran.length} peneira(s) fora da faixa:
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {ncsGran.map(r=>(
                <span key={r.id} className="badge nconf">{r.lb.trim()} → {fmt(r.pP,2)}%</span>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Identificação + Salvar */}
      <div style={{marginTop:12,background:T.surface,border:`1px solid ${T.border}`,borderRadius:6,padding:10}}>
        <div style={{fontSize:10,color:T.muted,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em"}}>Identificação do Registro</div>
        <Row>

// ══════════════════════════════════════════════════════════════════════
// RT – DNIT 136/2018-ME
// ══════════════════════════════════════════════════════════════════════
function RTCalc({proj}){
  const [cps,setCPs]=useState([{id:1,F:"",D:"10",H:""}]);
  const setV=(i,k,v)=>setCPs(p=>p.map((c,j)=>j===i?{...c,[k]:v}:c));
  const rt_min=proj?.rt_min||"0.65";
  const rt_max=proj?.rt_max||"";

  const calcRT=(F,D,H)=>{const f=nv(F),d=nv(D),h=nv(H);if(!f||!d||!h) return null;return (2*f)/(Math.PI*d*h)*0.0981;};
  const results=cps.map(c=>calcRT(c.F,c.D,c.H));
  const valid=results.filter(r=>r!==null);
  const media=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null;

  return(
    <div>
      {proj&&<div style={{marginBottom:10,padding:"6px 10px",background:`${T.accent}10`,border:`1px solid ${T.accent}30`,borderRadius:4,fontSize:10,color:T.dim}}>
        Limites do projeto <strong style={{color:T.accent}}>{proj.codigo}</strong>: RT ≥ <strong style={{color:T.text}}>{rt_min} MPa</strong>
        {rt_max&&<span> · RT ≤ <strong style={{color:T.text}}>{rt_max} MPa</strong></span>}
      </div>}
      <div style={{fontSize:10,color:T.dim,marginBottom:8}}>
        RT = (2 × F) / (π × D × H) × 0,0981 &nbsp;·&nbsp; F em kgf · D e H em cm → MPa &nbsp;·&nbsp; DNIT 136/2018-ME
      </div>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr><th>CP</th><th>Carga F (kgf)</th><th>Diâm. D (cm)</th><th>Alt. H (cm)</th><th>RT (MPa)</th><th>Situação</th></tr></thead>
          <tbody>
            {cps.map((c,i)=>{
              const rt=results[i];
              const s=rt!==null?avalia(rt,rt_min,rt_max):"pend";
              return(
                <tr key={c.id}>
                  <td style={{color:T.accent,fontWeight:700}}>{c.id}</td>
                  {["F","D","H"].map(k=>(
                    <td key={k}><input type="number" step="0.1" value={c[k]} onChange={e=>setV(i,k,e.target.value)} style={{width:80}}/></td>
                  ))}
                  <td style={{color:rt!=null?(s==="ok"?T.green:T.red):T.muted,fontWeight:700,fontFamily:"'Share Tech Mono'",fontSize:13}}>
                    {rt!=null?fmt(rt,3)+" MPa":"—"}
                  </td>
                  <td>{rt!=null?<Sb s={s}/>:"-"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Row style={{marginTop:8,alignItems:"center",gap:10}}>
        <Btn sm bg={T.surface} tc={T.accent} onClick={()=>setCPs(p=>[...p,{id:p.length+1,F:"",D:"10",H:""}])} style={{border:`1px solid ${T.border}`}}>+ CP</Btn>
        {media!==null&&(
          <div style={{padding:"5px 12px",background:avalia(media,rt_min,rt_max)==="ok"?T.greenB:T.redB,borderRadius:4,border:`1px solid ${avalia(media,rt_min,rt_max)==="ok"?T.green:T.red}40`}}>
            <span style={{fontSize:11,color:T.dim}}>Média RT: </span>
            <span style={{fontFamily:"'Share Tech Mono'",fontWeight:700,fontSize:14,color:avalia(media,rt_min,rt_max)==="ok"?T.green:T.red}}>{fmt(media,3)} MPa</span>
            <span style={{marginLeft:8}}><Sb s={avalia(media,rt_min,rt_max)}/></span>
          </div>
        )}
      </Row>
      <RTSaveRow proj={proj} cps={cps} results={results} valid={valid} media={media} rt_min={rt_min} rt_max={rt_max}/>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// RICE + MARSHALL – DNIT 427-ME + DNIT 447-ME + DNIT 449-PRO
// ══════════════════════════════════════════════════════════════════════
const RHOREF=0.99705;
function RiceCalc({onGmm}){
  const [dets,setDets]=useState([{id:1,A:"",B:"",C:"",T:"25"},{id:2,A:"",B:"",C:"",T:"25"}]);
  const setV=(i,k,v)=>setDets(d=>d.map((x,j)=>j===i?{...x,[k]:v}:x));
  const calcGmm=(A,B,C,Tp)=>{const a=nv(A),b=nv(B),c=nv(C);if(!a||!b||!c||(a+b-c)<=0) return null;return (a/(a+b-c))*(getDW(Tp)/RHOREF);};
  const results=dets.map(d=>calcGmm(d.A,d.B,d.C,d.T));
  const valid=results.filter(r=>r!==null);
  const mediaGmm=valid.length?valid.reduce((s,v)=>s+v,0)/valid.length:null;
  const diffOk=valid.length>=2?Math.max(...valid)-Math.min(...valid)<=0.011:null;
  useEffect(()=>{if(mediaGmm&&onGmm) onGmm(mediaGmm.toFixed(4));},[mediaGmm]);
  return(
    <div style={{border:`1px solid ${T.blue}40`,borderRadius:6,padding:10,marginBottom:12,background:`${T.blue}07`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:13,color:T.blue}}>
          🔬 Rice — DNIT 427-ME &nbsp;<span style={{fontSize:10,color:T.muted,fontWeight:400}}>Gmm = A/(A+B−C)×(ρ₂₅/ρT)</span>
        </span>
        {mediaGmm&&(
          <div style={{textAlign:"center",background:T.blueB,border:`1px solid ${T.blue}50`,borderRadius:4,padding:"4px 12px"}}>
            <div style={{fontSize:8,color:T.muted}}>Gmm calculado</div>
            <div style={{fontFamily:"'Share Tech Mono'",fontSize:18,fontWeight:700,color:T.blue}}>{fmt(mediaGmm,4)}</div>
            {diffOk!==null&&<div style={{fontSize:8,color:diffOk?T.green:T.red}}>{diffOk?"✓ dif≤0,011":"⚠ dif>0,011"}</div>}
          </div>
        )}
      </div>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr><th>Det.</th><th>A – Amostra seca (g)</th><th>B – Picnôm.+água (g)</th><th>C – Picnôm.+am.+água (g)</th><th>T°C</th><th>ρágua</th><th>Gmm</th></tr></thead>
          <tbody>
            {dets.map((d,i)=>(
              <tr key={d.id}>
                <td style={{color:T.blue,fontWeight:700}}>{d.id}</td>
                {["A","B","C"].map(k=>(
                  <td key={k}><input type="number" step="0.1" value={d[k]} onChange={e=>setV(i,k,e.target.value)} style={{width:100}}/></td>
                ))}
                <td><input type="number" step="1" min="15" max="35" value={d.T} onChange={e=>setV(i,"T",e.target.value)} style={{width:55}}/></td>
                <td style={{color:T.dim,fontSize:10}}>{fmt(getDW(d.T),5)}</td>
                <td style={{color:results[i]?T.blue:T.muted,fontWeight:700}}>{results[i]?fmt(results[i],4):"—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {dets.length<3&&<Btn sm bg={T.blueB} tc={T.blue} onClick={()=>setDets(d=>[...d,{id:d.length+1,A:"",B:"",C:"",T:"25"}])} style={{marginTop:6}}>+ 3ª det.</Btn>}
    </div>
  );
}

function MarshallCalc({proj}){
  const [GmmRice,setGmmRice]=useState("");
  const [GmmMan,setGmmMan]=useState("");
  const [modoGmm,setModo]=useState("rice");
  const [Gsb,setGsb]=useState(proj?.densAparComb||"2.700");
  const [Pb,setPb]=useState(proj?.teorcapOtimo||"");
  const [cps,setCPs]=useState([1,2,3].map(i=>({id:i,A:"",B:"",C:"",H:"",El:"",flu:""})));
  const setV=(i,k,v)=>setCPs(p=>p.map((c,j)=>j===i?{...c,[k]:v}:c));

  useEffect(()=>{if(proj?.densAparComb) setGsb(proj.densAparComb);if(proj?.teorcapOtimo) setPb(proj.teorcapOtimo);},[proj]);

  const Gmm=modoGmm==="rice"?GmmRice:GmmMan;

  const calcCP=c=>{
    const A=nv(c.A),B=nv(c.B),C=nv(c.C),El=nv(c.El),H=nv(c.H);
    if(!A||!B||!C||B===C) return null;
    const Gmb=A/(B-C);
    const Gm=nv(Gmm),Gs=nv(Gsb),Pb_v=nv(Pb);
    const Vv=Gm>0?100*(1-Gmb/Gm):null;
    const Ps=100-Pb_v;
    const VAM=Gs>0?100-(Gmb*Ps/Gs):null;
    const RBV=VAM&&Vv!==null&&VAM>0?((VAM-Vv)/VAM)*100:null;
    const fator=getMC(H);
    const Ec=El>0?El*fator:null;
    return {Gmb,Vv,VAM,RBV,Ec,fator,flu:nv(c.flu)};
  };
  const results=cps.map(c=>calcCP(c));
  const valid=results.filter(r=>r!==null);
  const med=k=>valid.length?valid.reduce((s,r)=>s+(r[k]||0),0)/valid.length:null;
  const mGmb=med("Gmb"),mVv=med("Vv"),mVAM=med("VAM"),mRBV=med("RBV"),mE=med("Ec"),mF=med("flu");

  const va_min=proj?.va_min||"3.0",va_max=proj?.va_max||"5.0";
  const rbv_min=proj?.rbv_min||"65.0",rbv_max=proj?.rbv_max||"78.0";
  const vam_min=proj?.vam_min||"13.0",vam_max=proj?.vam_max||"";
  const est_min=proj?.estab_min||"500",est_max=proj?.estab_max||"";
  const flu_min=proj?.fluencia_min||"",flu_max=proj?.fluencia_max||"";

  return(
    <div>
      {proj&&<div style={{marginBottom:10,padding:"6px 10px",background:`${T.accent}10`,border:`1px solid ${T.accent}30`,borderRadius:4,fontSize:10,color:T.dim}}>
        Limites do projeto <strong style={{color:T.accent}}>{proj.codigo}</strong>: Vv {va_min}–{va_max}% · RBV {rbv_min}–{rbv_max}% · VAM ≥{vam_min}% · Estab. ≥{est_min} kgf
      </div>}

      <RiceCalc onGmm={setGmmRice}/>

      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:6,padding:10,marginBottom:10}}>
        <Row style={{marginBottom:8}}>
          {["rice","manual"].map(m=>(
            <button key={m} onClick={()=>setModo(m)} style={{
              padding:"4px 10px",fontSize:11,fontWeight:700,borderRadius:3,
              background:modoGmm===m?T.blue:T.surface,color:modoGmm===m?T.bg:T.muted,
              border:`1px solid ${modoGmm===m?T.blue:T.border}`
            }}>{m==="rice"?"Gmm do Rice":"Gmm Manual"}</button>
          ))}
        </Row>
        <Row>
          {modoGmm==="rice"
            ?<div style={{padding:"5px 10px",background:T.blueB,border:`1px solid ${T.blue}40`,borderRadius:4,fontSize:12}}>
               Gmm: <strong style={{color:T.blue}}>{GmmRice||"preencher Rice acima ↑"}</strong>
             </div>
            :<FL label="Gmm manual" w="160px"><input type="number" step="0.0001" value={GmmMan} onChange={e=>setGmmMan(e.target.value)} placeholder="2.5201"/></FL>
          }
          <FL label="Gsb – Dens. Real Agreg." w="180px">
            <input type="number" step="0.001" value={Gsb} onChange={e=>setGsb(e.target.value)}/>
          </FL>
          <FL label="Pb – Teor CAP (%)" w="150px">
            <input type="number" step="0.01" value={Pb} onChange={e=>setPb(e.target.value)} placeholder="5.50"/>
          </FL>
        </Row>
      </div>

      <div style={{overflowX:"auto",marginBottom:8}}>
        <table>
          <thead>
            <tr>
              <th>CP</th><th>A – Seco (g)</th><th>B – Sat.Sup. (g)</th><th>C – Subm. (g)</th>
              <th>Gmb</th><th>Vv (%)</th><th>VAM (%)</th><th>RBV (%)</th>
              <th>H (cm)</th><th>Fat.</th><th>E.Lida (kgf)</th><th>E.Corr. (kgf)</th><th>Fluência</th>
            </tr>
          </thead>
          <tbody>
            {cps.map((c,i)=>{
              const r=results[i];
              return(
                <tr key={c.id}>
                  <td style={{color:T.accent,fontWeight:700}}>{c.id}</td>
                  {["A","B","C"].map(k=>(
                    <td key={k}><input type="number" step="0.1" value={c[k]} onChange={e=>setV(i,k,e.target.value)} style={{width:85}}/></td>
                  ))}
                  <td style={{fontFamily:"'Share Tech Mono'",color:T.text}}>{r?fmt(r.Gmb,4):"—"}</td>
                  <td style={{color:r?.Vv!=null?(avalia(r.Vv,va_min,va_max)==="ok"?T.green:T.red):T.muted,fontWeight:700,fontFamily:"'Share Tech Mono'"}}>
                    {r?.Vv!=null?fmt(r.Vv,2)+"% "+"":""}<br/>{r?.Vv!=null&&<Sb s={avalia(r.Vv,va_min,va_max)}/>}
                  </td>
                  <td style={{color:T.dim,fontFamily:"'Share Tech Mono'"}}>{r?.VAM!=null?fmt(r.VAM,2)+"%":"—"}</td>
                  <td style={{color:r?.RBV!=null?(avalia(r.RBV,rbv_min,rbv_max)==="ok"?T.green:T.red):T.muted,fontWeight:700,fontFamily:"'Share Tech Mono'"}}>
                    {r?.RBV!=null?fmt(r.RBV,2)+"%":""}<br/>{r?.RBV!=null&&<Sb s={avalia(r.RBV,rbv_min,rbv_max)}/>}
                  </td>
                  <td><input type="number" step="0.01" value={c.H} onChange={e=>setV(i,"H",e.target.value)} style={{width:65}} placeholder="6.35"/></td>
                  <td style={{color:T.dim,fontSize:10,fontFamily:"'Share Tech Mono'"}}>{r?fmt(r.fator,2):"—"}</td>
                  <td><input type="number" step="1" value={c.El} onChange={e=>setV(i,"El",e.target.value)} style={{width:75}}/></td>
                  <td style={{color:r?.Ec!=null?(avalia(r.Ec,est_min,est_max)==="ok"?T.green:T.red):T.muted,fontWeight:700,fontSize:13,fontFamily:"'Share Tech Mono'"}}>
                    {r?.Ec!=null?fmt(r.Ec,0):"—"}
                  </td>
                  <td><input type="number" step="0.25" value={c.flu} onChange={e=>setV(i,"flu",e.target.value)} style={{width:70}}/></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Btn sm bg={T.surface} tc={T.accent} onClick={()=>setCPs(p=>[...p,{id:p.length+1,A:"",B:"",C:"",H:"",El:"",flu:""}])} style={{border:`1px solid ${T.border}`}}>+ CP</Btn>

      {valid.length>0&&(
        <div style={{marginTop:10,background:T.surface,border:`1px solid ${T.border}`,borderRadius:6,padding:10}}>
          <ST c={T.accent} mb={8}>Médias — {valid.length} CP(s)</ST>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:7,marginBottom:10}}>
            {[
              {l:"Gmm (Rice)",v:Gmm?fmt(nv(Gmm),4):"—",c:T.blue},
              {l:"Gmb médio",v:fmt(mGmb,4),c:T.text},
              {l:"Vv médio",v:mVv!=null?fmt(mVv,2)+"%":"—",c:mVv!=null?(avalia(mVv,va_min,va_max)==="ok"?T.green:T.red):T.muted},
              {l:"VAM médio",v:mVAM!=null?fmt(mVAM,2)+"%":"—",c:T.dim},
              {l:"RBV médio",v:mRBV!=null?fmt(mRBV,2)+"%":"—",c:mRBV!=null?(avalia(mRBV,rbv_min,rbv_max)==="ok"?T.green:T.red):T.muted},
              {l:"Estab. corr.",v:mE!=null?fmt(mE,0)+" kgf":"—",c:mE!=null?(avalia(mE,est_min,est_max)==="ok"?T.green:T.red):T.muted},
              {l:"Fluência",v:mF!=null?fmt(mF,2)+" ×0,25mm":"—",c:T.text},
            ].map(({l,v,c})=>(
              <div key={l} style={{background:T.card,padding:"7px 9px",borderRadius:4,borderLeft:`3px solid ${c==="—"?T.border:c}`}}>
                <div style={{fontSize:8,color:T.muted,marginBottom:2}}>{l}</div>
                <div style={{fontFamily:"'Share Tech Mono'",fontSize:14,fontWeight:700,color:c}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {mVv!=null&&<Sb s={avalia(mVv,va_min,va_max)}/>}
            {mRBV!=null&&<span className={`badge ${avalia(mRBV,rbv_min,rbv_max)==="ok"?"conf":"nconf"}`}>RBV {avalia(mRBV,rbv_min,rbv_max)==="ok"?"OK":"NC"}</span>}
            {mE!=null&&<span className={`badge ${avalia(mE,est_min,est_max)==="ok"?"conf":"nconf"}`}>Estab. {avalia(mE,est_min,est_max)==="ok"?"OK":"NC"}</span>}
            {mVAM!=null&&<span className={`badge ${avalia(mVAM,vam_min,vam_max)==="ok"?"conf":"pend"}`}>VAM {avalia(mVAM,vam_min,vam_max)==="ok"?"OK":"NC"}</span>}
          </div>
        </div>
      )}
      <MarshallSaveRow proj={proj} Gmm={Gmm} mGmb={mGmb} mVv={mVv} mVAM={mVAM} mRBV={mRBV} mE={mE} mF={mF}
        va_min={va_min} va_max={va_max} rbv_min={rbv_min} rbv_max={rbv_max} vam_min={vam_min} est_min={est_min}/>
    </div>
  );
}

function MarshallSaveRow({proj,Gmm,mGmb,mVv,mVAM,mRBV,mE,mF,va_min,va_max,rbv_min,rbv_max,vam_min,est_min}){
  const [trecho,setTrecho]=useState("");
  const [lote,setLote]=useState("");
  const [tecnico,setTecnico]=useState("");
  const statusGeral=()=>{
    if(mVv==null&&mE==null) return "PENDENTE";
    const oks=[avalia(mVv,va_min,va_max),avalia(mRBV,rbv_min,rbv_max),avalia(mE,est_min,"")];
    if(oks.some(s=>s==="nc")) return "NÃO CONFORME";
    if(oks.every(s=>s==="ok")) return "CONFORME";
    return "PENDENTE";
  };
  return(
    <div style={{marginTop:12,background:T.surface,border:`1px solid ${T.border}`,borderRadius:6,padding:10}}>
      <div style={{fontSize:10,color:T.muted,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em"}}>Identificação do Registro</div>
      <Row>
        <FL label="Trecho / KM" style={{flex:1}}><input value={trecho} onChange={e=>setTrecho(e.target.value)} placeholder="Ex: KM 45+200"/></FL>
        <FL label="Lote / N° Betonada" style={{flex:1}}><input value={lote} onChange={e=>setLote(e.target.value)} placeholder="Ex: MAR-005"/></FL>
        <FL label="Técnico" style={{flex:1}}><input value={tecnico} onChange={e=>setTecnico(e.target.value)} placeholder="Nome"/></FL>
      </Row>
      <SaveBtn
        proj={proj}
        tipo="Rice + Marshall + Volumétricos (DNIT 427+447+449)"
        dados={{gmm:nv(Gmm),gmb:mGmb,vv:mVv,vam:mVAM,rbv:mRBV,estab:mE,fluencia:mF}}
        extra={{trecho,lote,tecnico}}
        status={statusGeral()}
        onSaved={()=>{}}
      />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// EQUIVALENTE DE AREIA
// ══════════════════════════════════════════════════════════════════════
function EquivArCalc({proj}){
  const [hs,setHs]=useState([{id:1,h1:"",h2:""}]);
  const setV=(i,k,v)=>setHs(h=>h.map((x,j)=>j===i?{...x,[k]:v}:x));
  const eq_min=proj?.eq_areia_min||"55";
  const calcSE=(h1,h2)=>{const a=nv(h1),b=nv(h2);return a&&b?(b/a)*100:null;};
  const results=hs.map(h=>calcSE(h.h1,h.h2));
  const valid=results.filter(r=>r!==null);
  const media=valid.length?valid.reduce((s,v)=>s+v,0)/valid.length:null;
  return(
    <div>
      <div style={{fontSize:10,color:T.dim,marginBottom:8}}>
        SE = (H2/H1) × 100 · H1=nível total · H2=nível areia · Critério: SE ≥ {eq_min}% · DNIT 450-ME
      </div>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr><th>Amostra</th><th>H1 – Total (mm)</th><th>H2 – Areia (mm)</th><th>SE (%)</th><th>Situação</th></tr></thead>
          <tbody>
            {hs.map((h,i)=>{
              const se=results[i];
              return(
                <tr key={h.id}>
                  <td style={{color:T.accent}}>{h.id}</td>
                  <td><input type="number" step="0.5" value={h.h1} onChange={e=>setV(i,"h1",e.target.value)} style={{width:100}}/></td>
                  <td><input type="number" step="0.5" value={h.h2} onChange={e=>setV(i,"h2",e.target.value)} style={{width:100}}/></td>
                  <td style={{color:se!=null?(avalia(se,eq_min,"")=="ok"?T.green:T.red):T.muted,fontWeight:700,fontFamily:"'Share Tech Mono'"}}>{se!=null?fmt(se,1)+"%":"—"}</td>
                  <td>{se!=null?<Sb s={avalia(se,eq_min,"")}/>:"-"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Row style={{marginTop:8,alignItems:"center",gap:10}}>
        <Btn sm bg={T.surface} tc={T.accent} onClick={()=>setHs(p=>[...p,{id:p.length+1,h1:"",h2:""}])} style={{border:`1px solid ${T.border}`}}>+ Amostra</Btn>
        {media!==null&&(
          <div style={{padding:"5px 12px",background:avalia(media,eq_min,"")==="ok"?T.greenB:T.redB,borderRadius:4}}>
            <span style={{fontFamily:"'Share Tech Mono'",fontWeight:700,fontSize:14,color:avalia(media,eq_min,"")==="ok"?T.green:T.red}}>{fmt(media,1)}%</span>
            <span style={{marginLeft:8}}><Sb s={avalia(media,eq_min,"")}/></span>
          </div>
        )}
      </Row>
      <EquivSaveRow proj={proj} nAmostras={valid.length} mediaSE={media} eq_min={eq_min}/>
    </div>
  );
}

function EquivSaveRow({proj,nAmostras,mediaSE,eq_min}){
  const [trecho,setTrecho]=useState("");
  const [lote,setLote]=useState("");
  const [tecnico,setTecnico]=useState("");
  return(
    <div style={{marginTop:12,background:T.surface,border:`1px solid ${T.border}`,borderRadius:6,padding:10}}>
      <div style={{fontSize:10,color:T.muted,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:".07em"}}>Identificação do Registro</div>
      <Row>
        <FL label="Trecho / KM" style={{flex:1}}><input value={trecho} onChange={e=>setTrecho(e.target.value)} placeholder="Ex: KM 45+200"/></FL>
        <FL label="Lote / N° Amostra" style={{flex:1}}><input value={lote} onChange={e=>setLote(e.target.value)} placeholder="Ex: SE-003"/></FL>
        <FL label="Técnico" style={{flex:1}}><input value={tecnico} onChange={e=>setTecnico(e.target.value)} placeholder="Nome"/></FL>
      </Row>
      <SaveBtn
        proj={proj}
        tipo="Equivalente de Areia – DNIT 450-ME"
        dados={{nAmostras,mediaSE,eq_min}}
        extra={{trecho,lote,tecnico}}
        status={mediaSE!=null?(avalia(mediaSE,eq_min,"")==="ok"?"CONFORME":"NÃO CONFORME"):"PENDENTE"}
        onSaved={()=>{}}
      />
    </div>
  );
}

// CONTROLE ESTATÍSTICO – modelo SPMAR/Contern · Anexo A DNIT 031/2024
// Tabela resumo: 1 linha/ensaio + rodapé N·Média·Sd·k·X̄±kS·APROVADO
// ══════════════════════════════════════════════════════════════════════
const KT={5:1.55,6:1.41,7:1.36,8:1.31,9:1.25,10:1.21,11:1.19,12:1.16,13:1.13,14:1.11,15:1.10,16:1.08,17:1.06,19:1.04,21:1.01};
const getK=n=>{if(n<=5) return 1.55;if(n>=21) return 1.01;const ks=Object.keys(KT).map(Number).sort((a,b)=>a-b);for(const k of ks){if(n<=k) return KT[k];}return 1.01;};
function estatArr(arr){const v=arr.filter(x=>x!==null&&!isNaN(x));if(!v.length)return{n:0,med:null,sd:null,k:null,xmin:null,xmax:null};const n=v.length;const med=v.reduce((a,b)=>a+b,0)/n;const sd=n>1?Math.sqrt(v.map(x=>(x-med)**2).reduce((a,b)=>a+b,0)/(n-1)):0;const k=getK(n);return{n,med,sd,k,xmin:med-k*sd,xmax:med+k*sd};}
const ECOLS=[
  {id:"pb",   lb:"Betume %",    d:2, get:e=>e.dados?.pb,    lim:p=>({mn:null,mx:null})},
  {id:"gmm",  lb:"Gmm",         d:4, get:e=>e.dados?.gmm,   lim:p=>({mn:null,mx:null})},
  {id:"gmb",  lb:"Gmb",         d:4, get:e=>e.dados?.gmb,   lim:p=>({mn:null,mx:null})},
  {id:"vv",   lb:"Vv (%)",      d:2, get:e=>e.dados?.vv,    lim:p=>({mn:parseFloat(p?.va_min||3),mx:parseFloat(p?.va_max||5)})},
  {id:"vam",  lb:"VAM (%)",     d:2, get:e=>e.dados?.vam,   lim:p=>({mn:parseFloat(p?.vam_min||13),mx:null})},
  {id:"rbv",  lb:"RBV (%)",     d:2, get:e=>e.dados?.rbv,   lim:p=>({mn:parseFloat(p?.rbv_min||65),mx:parseFloat(p?.rbv_max||78)})},
  {id:"estab",lb:"Estab.(kgf)", d:0, get:e=>e.dados?.estab, lim:p=>({mn:parseFloat(p?.estab_min||500),mx:null})},
  {id:"flu",  lb:"Flu.(mm)",    d:2, get:e=>e.dados?.fluencia, lim:p=>({mn:null,mx:null})},
  {id:"rt",   lb:"RT (MPa)",    d:3, get:e=>e.dados?.mediaRT,lim:p=>({mn:parseFloat(p?.rt_min||0.65),mx:null})},
];
const GCOLS=[
  {id:"p38",  lb:'3/4"'},{id:"p25",lb:'1/2"'},{id:"p19",lb:'3/8"'},
  {id:"p127", lb:'1/4"'},{id:"p48",lb:'nº4'}, {id:"p236",lb:'nº8'},
  {id:"p118", lb:'nº16'},{id:"p060",lb:'nº30'},{id:"p0075",lb:'nº200'},
];
const getGP=(e,id)=>{const r=(e.dados?.granRows||[]).find(x=>x.id===id);return r?.pP!=null?r.pP:null;};

function EstatCalc({proj,ensaios,projetos}){
  const [projFiltro,setProjFiltro]=useState(proj?.id||"todos");
  const [dtIni,setDtIni]=useState("");
  const [dtFim,setDtFim]=useState("");
  const projSel=projetos.find(p=>p.id===projFiltro)||proj;
  const linhas=ensaios.filter(e=>{
    const pOk=projFiltro==="todos"||e.projId===projFiltro;
    const dOk=e.dados&&(e.dados.gmb!=null||e.dados.pb!=null||e.dados.mediaRT!=null);
    const d=new Date(e.data||e.savedAt);
    return pOk&&dOk&&(!dtIni||d>=new Date(dtIni+"T00:00:00"))&&(!dtFim||d<=new Date(dtFim+"T23:59:59"));
  }).sort((a,b)=>new Date(a.data||a.savedAt)-new Date(b.data||b.savedAt));
  const fN=(v,d=2)=>v!=null&&!isNaN(v)?Number(v).toFixed(d):"—";
  const dS=iso=>{if(!iso)return"—";return new Date(iso).toLocaleDateString("pt-BR");};
  const eCols=ECOLS.map(c=>{const vals=linhas.map(e=>{const v=c.get(e);return v!=null?parseFloat(v):null;});const s=estatArr(vals);const lim=c.lim(projSel);const ok=s.xmin!=null?((!lim.mn||s.xmin>=lim.mn)&&(!lim.mx||s.xmax<=lim.mx)):null;return{...c,vals,s,lim,ok};}).filter(c=>c.s.n>0);
  const gCols=GCOLS.map(gc=>{const vals=linhas.map(e=>getGP(e,gc.id));const s=estatArr(vals.filter(v=>v!==null));const fp=projSel?.faixaProjeto?.[gc.id];const mn=fp?.min?parseFloat(fp.min):null;const mx=fp?.max?parseFloat(fp.max):null;const ok=s.xmin!=null?((mn===null||s.xmin>=mn)&&(mx===null||s.xmax<=mx)):null;return{...gc,vals,s,mn,mx,ok};}).filter(c=>c.s.n>0);

    const dRows=linhas.map((e,i)=>{

      const eCells=eCols.map(c=>{const v=c.get(e);const vn=v!=null?parseFloat(v):null;const ok=vn!=null?(c.lim.mn&&vn<c.lim.mn?false:c.lim.mx&&vn>c.lim.mx?false:true):null;const col=ok===false?"#7a1a1a":ok===true?"#1a5a2a":"#000";return`<td style="background:${bg};color:${col};font-weight:${ok===false?700:400}">${vn!=null?fN(vn,c.d):"—"}</td>`;}).join("");

    const statDefs=[{cls:"sn",lb:"N",fn:s=>s.n},{cls:"sm",lb:"Média (X̄)",fn:s=>fN(s.med,3)},{cls:"ss",lb:"Desv. Pad. S",fn:s=>fN(s.sd,3)},{cls:"sk",lb:"k (Tab.A1)",fn:s=>fN(s.k,2)},{cls:"sH",lb:"X̄ + k·S (máx)",fn:s=>fN(s.xmax,3)},{cls:"sL",lb:"X̄ − k·S (mín)",fn:s=>fN(s.xmin,3)}];

    const rSup=`<tr><td colspan="2" style="font-weight:700;text-align:left;padding-left:4px;font-size:5.5pt;background:#e0ffe0;">Limite Superior</td>${gCols.map(gc=>`<td class="rsup">${gc.mx!=null?fN(gc.mx,0):"—"}</td>`).join("")}${eCols.map(c=>`<td class="rsup">${c.lim.mx!=null?fN(c.lim.mx,c.d):"—"}</td>`).join("")}</tr>`;

<div class="sig">

                    <td colSpan={2} style={{color:row.c,fontWeight:700,fontSize:10,fontFamily:"'Rajdhani',sans-serif",textTransform:"uppercase",letterSpacing:".06em"}}>{row.lb}</td>
                    {gCols.map(gc=><td key={gc.id} style={{color:row.c,fontWeight:600,fontSize:11,fontFamily:"monospace"}}>{row.fn(gc.s)}</td>)}
                    {eCols.map(c=><td key={c.id} style={{color:row.c,fontWeight:600,fontSize:11,fontFamily:"monospace"}}>{row.fn(c.s)}</td>)}
                    <td/>
                  </tr>
                ))}
                <tr style={{background:T.card}}>
                  <td colSpan={2} style={{color:T.accent,fontWeight:800,fontSize:10,fontFamily:"'Rajdhani',sans-serif"}}>OBS:</td>
                  {gCols.map(gc=><td key={gc.id}><span className={`badge ${gc.ok===false?"nconf":gc.ok===true?"conf":"pend"}`}>{gc.ok===false?"REPROV":gc.ok===true?"APROV":"—"}</span></td>)}
                  {eCols.map(c=><td key={c.id}><span className={`badge ${c.ok===false?"nconf":c.ok===true?"conf":"pend"}`}>{c.ok===false?"REPROV":c.ok===true?"APROV":"—"}</span></td>)}
                  <td/>
                </tr>
              </tfoot>
            </table>
          </div>
        </Card>
      )}
      <div style={{textAlign:"center",padding:"10px 0"}}>
        <button onClick={gerarPDF} style={{background:linhas.length>0?T.accent:"#333",color:linhas.length>0?T.bg:T.muted,padding:"11px 36px",fontSize:15,fontWeight:700,borderRadius:6,border:"none",cursor:linhas.length>0?"pointer":"not-allowed",fontFamily:"'Rajdhani',sans-serif",letterSpacing:".06em"}}>
          📄 Gerar Controle Estatístico PDF (A3 Paisagem)
        </button>
        <div style={{fontSize:10,color:T.muted,marginTop:6}}>Formato A3 paisagem · Estilo SPMAR/Contern · N · X̄ · S · k · X̄±kS · Limites · APROVADO/REPROVADO por coluna</div>
      </div>
    </div>
  );
}

// ── Botão salvar ensaio (usado em cada aba) ───────────────────────────
function SaveBtn({dados,tipo,proj,onSaved,extra={},status:statusEnsaio="PENDENTE"}){
  const [status,setStatus]=useState("idle"); // idle|saving|done|err
  const salvar=async()=>{
    if(!proj){alert("Selecione um projeto antes de salvar.");return;}
    setStatus("saving");
    try{
      await saveEnsaio({dados,tipo,projId:proj.id,projCodigo:proj.codigo,projNome:proj.nome,status:statusEnsaio,...extra});
      setStatus("done");
      setTimeout(()=>setStatus("idle"),2000);
      onSaved&&onSaved();
    }catch(e){setStatus("err");setTimeout(()=>setStatus("idle"),2000);}
  };
  const map={idle:{bg:T.green,tc:T.bg,label:"💾 Salvar Resultado"},saving:{bg:T.muted,tc:T.bg,label:"Salvando..."},done:{bg:T.greenB,tc:T.green,label:"✓ Salvo!"},err:{bg:T.redB,tc:T.red,label:"Erro — tentar novamente"}};
  const m=map[status];
  return <button onClick={salvar} disabled={status==="saving"} style={{background:m.bg,color:m.tc,padding:"7px 16px",fontSize:12,fontWeight:700,borderRadius:4,border:`1px solid ${status==="done"?T.green:T.border}`,marginTop:10,width:"100%"}}>{m.label}</button>;
}

// ══════════════════════════════════════════════════════════════════════
// RELATÓRIO — filtro por projeto + período → PDF via window.print()
// ══════════════════════════════════════════════════════════════════════
function Relatorio({projetos,ensaios,projetoAtivo,onDelete}){
  const [projFiltro,setProjFiltro]=useState(projetoAtivo?.id||"todos");
  const [dtIni,setDtIni]=useState("");
  const [dtFim,setDtFim]=useState("");
  const [tipoFiltro,setTipoFiltro]=useState("todos");
  const [obra,setObra]=useState("");
  const [emissao,setEmissao]=useState(new Date().toLocaleDateString("pt-BR"));
  const [respTec,setRespTec]=useState("");
  const [engResp,setEngResp]=useState("");
  const [creaEng,setCreaEng]=useState("");
  const [fiscal,setFiscal]=useState("");
  const [obs,setObs]=useState("");

  // Preenche automaticamente com dados do projeto selecionado
  useEffect(()=>{
    const p=projetos.find(x=>x.id===projFiltro);
    if(p){
      setObra(p.cliente||"");
      setRespTec(p.responsavel||"");
      setEngResp(p.engResp||"");
      setCreaEng(p.crea||"");
    }
  },[projFiltro,projetos]);

  // Filtragem
  const filtrados=ensaios.filter(e=>{
    const pOk=projFiltro==="todos"||e.projId===projFiltro;
    const d=new Date(e.data);
    const diOk=!dtIni||d>=new Date(dtIni+"T00:00:00");
    const dfOk=!dtFim||d<=new Date(dtFim+"T23:59:59");
    const tOk=tipoFiltro==="todos"||e.tipo===tipoFiltro;
    return pOk&&diOk&&dfOk&&tOk;
  }).sort((a,b)=>new Date(a.data)-new Date(b.data));

  const projSel=projetos.find(x=>x.id===projFiltro);

  // Contagens
  const conf=filtrados.filter(e=>e.status==="CONFORME").length;
  const nc=filtrados.filter(e=>e.status==="NÃO CONFORME").length;
  const total=filtrados.length;
  const pctConf=total?Math.round((conf/total)*100):0;

  // Tipos únicos nos ensaios filtrados
  const tipos=[...new Set(ensaios.map(e=>e.tipo))].filter(Boolean);

  // Agrupamento por tipo de ensaio
  const porTipo={};
  filtrados.forEach(e=>{
    const k=e.tipo||"Outros";
    if(!porTipo[k]) porTipo[k]=[];
    porTipo[k].push(e);
  });

  const dtStr=iso=>{if(!iso)return "-";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};

  // ── Geração do HTML estilo STH (A4 paisagem) ───────────────────
  const gerarPDF=()=>{
    const w=window.open("","_blank","width=1080,height=760");
    if(!w){alert("Permita popups para este site.");return;}

    const statusColor=s=>s==="CONFORME"?"#1a7a43":s==="NÃO CONFORME"?"#7a1a1a":"#4a4a00";
    const statusText=s=>s==="CONFORME"?"✓ CONFORME":s==="NÃO CONFORME"?"✗ NÃO CONF.":"◌ PENDENTE";

    // Seção de cada tipo de ensaio
    const secoes=Object.entries(porTipo).map(([tipo,lista])=>{
      const cT=lista.filter(e=>e.status==="CONFORME").length;
      const ncT=lista.filter(e=>e.status==="NÃO CONFORME").length;

      // Colunas dinâmicas por tipo
      const getCols=t=>{
        if(t.includes("Extração")||t.includes("Granulometria")) return ["Massa Mistura","Massa Agr.","Pb (%)","Desvio","Status Pb","NC Granulo"];
        if(t.includes("Tração")||t.includes("RT")) return ["N° CPs","RT Média (MPa)","RT Mín (MPa)","RT Máx (MPa)","Status"];
        if(t.includes("Marshall")||t.includes("Rice")) return ["Gmm","Gmb","Vv (%)","RBV (%)","VAM (%)","Estab. (kgf)","Status"];
        if(t.includes("Equiv")) return ["N° amostras","SE Média (%)","Status"];
        if(t.includes("Estat")) return ["N","Média","Sd","k","X̄-kS","X̄+kS","Status"];
        return ["Dados","Status"];
      };

      const getRow=(e,t)=>{
        const d=e.dados||{};
        if(t.includes("Extração")||t.includes("Granulometria")) return [
          d.massaMist||"—",d.massaAgg||"—",
          d.pb!=null?Number(d.pb).toFixed(3)+"%":"—",

        if(t.includes("Marshall")||t.includes("Rice")) return [

            ${lista.map((e,i)=>{
              const row=getRow(e,tipo);

              return `<tr style="background:${i%2===0?"#fff":sc}">
                <td>${i+1}</td>

    const html=`<!DOCTYPE html>

</head><body>
<div class="sheet">

<!-- CABEÇALHO ══════════════════════════════════════════ -->
<div class="hdr">
  <div>
    <div class="hdr-title">RELATÓRIO DE CONTROLE TECNOLÓGICO — LABORATÓRIO DE ASFALTO</div>
    <div class="hdr-sub">DNIT 031/2024-ES · Concreto Asfáltico Usinado a Quente · SGLAA · ${new Date().toLocaleString("pt-BR")}</div>
  </div>
  <div class="hdr-right">
    ${badge(filtrados.some(e=>e.status==="NÃO CONFORME")?"NÃO CONFORME":filtrados.length&&filtrados.every(e=>e.status==="CONFORME")?"CONFORME":"PENDENTE")}
    <div style="margin-top:2px;">Período: ${dtIni||"início"} a ${dtFim||"atual"}</div>
  </div>
</div>

<!-- INFO DA OBRA ════════════════════════════════════════ -->
<div class="info-grid" style="grid-template-columns:2fr 2fr 1fr 1fr 1fr 1.5fr 1.5fr 1fr;">
  <div class="info-cell"><span class="lbl">Projeto / Código</span><span class="val">${projSel?.codigo||"Todos"}</span></div>
  <div class="info-cell"><span class="lbl">Denominação</span><span class="val">${projSel?.nome||"—"}</span></div>
  <div class="info-cell"><span class="lbl">CAP</span><span class="val">${projSel?.capTipo||"—"}</span></div>
  <div class="info-cell"><span class="lbl">Teor Ótimo</span><span class="val">${projSel?.teorcapOtimo||"—"}%</span></div>
  <div class="info-cell"><span class="lbl">Faixa Granu.</span><span class="val">${projSel?.faixaDNIT||"—"}</span></div>
  <div class="info-cell"><span class="lbl">Cliente / Obra</span><span class="val">${obra||"—"}</span></div>
  <div class="info-cell"><span class="lbl">Resp. Técnico</span><span class="val">${respTec||"—"}</span></div>
  <div class="info-cell"><span class="lbl">Fiscal</span><span class="val">${fiscal||"—"}</span></div>
</div>
<div class="info-grid" style="grid-template-columns:2fr 2fr 2fr 2fr;">
  <div class="info-cell"><span class="lbl">Engenheiro Responsável</span><span class="val">${engResp||"—"} ${creaEng?"· CREA "+creaEng:""}</span></div>
  <div class="info-cell"><span class="lbl">Período do Relatório</span><span class="val">${dtIni||"início"} → ${dtFim||"atual"}</span></div>
  <div class="info-cell"><span class="lbl">Data de Emissão</span><span class="val">${emissao||"—"}</span></div>
  <div class="info-cell"><span class="lbl">Total de Registros</span><span class="val">${total} ensaios</span></div>
</div>

<!-- KPIs ═══════════════════════════════════════════════ -->
<div class="kpi-row">
  <div class="kpi"><div class="kpi-n" style="color:#1a3a6a;">${total}</div><div class="kpi-l">Total Ensaios</div></div>
  <div class="kpi"><div class="kpi-n" style="color:#1a7a43;">${conf}</div><div class="kpi-l">Conformes</div></div>
  <div class="kpi"><div class="kpi-n" style="color:#7a1a1a;">${nc}</div><div class="kpi-l">Não Conformes</div></div>
  <div class="kpi">
    <div class="kpi-n" style="color:${barColor(pctConf2)};">${pctConf2}%</div>
    <div class="kpi-l">% Conformidade</div>
    <div class="bar-bg"><div class="bar-fg" style="width:${pctConf2}%;background:${barColor(pctConf2)};"></div></div>
  </div>
  <div class="kpi"><div class="kpi-n" style="color:#666;">${total-conf-nc}</div><div class="kpi-l">Pendentes</div></div>
  ${Object.entries(porTipo).map(([t,l])=>`<div class="kpi"><div class="kpi-n" style="color:#2a4a8a;font-size:12pt;">${l.length}</div><div class="kpi-l">${t.split("(")[0].trim().slice(0,20)}</div></div>`).join("")}
</div>

<!-- LIMITES DO PROJETO ══════════════════════════════════ -->
${limsHTML}

<!-- RESULTADOS DOS ENSAIOS ══════════════════════════════ -->
${secHTML||'<div style="color:#888;font-style:italic;padding:12px 0;text-align:center;font-size:8pt;">Nenhum ensaio registrado para os filtros selecionados.</div>'}

<!-- OBSERVAÇÕES ═════════════════════════════════════════ -->
${obs?`<div class="sec-title" style="margin-top:8px;">Observações / Ressalvas</div>
<div style="border:0.5px solid #ccc;padding:5px 8px;font-size:7pt;color:#333;min-height:20px;margin-top:2px;">${obs}</div>`:""}

<!-- ASSINATURAS ═════════════════════════════════════════ -->
<div class="sig-row">
  <div class="sig-cell"><div class="sig-line"></div><strong>Técnico de Laboratório</strong><br/>${respTec||"_______________________________"}</div>
  <div class="sig-cell"><div class="sig-line"></div><strong>Engenheiro Responsável</strong><br/>${engResp||"_______________________________"}<br/><span style="font-size:6pt;">CREA: ${creaEng||"______________"}</span></div>
  <div class="sig-cell"><div class="sig-line"></div><strong>Fiscal / DNIT</strong><br/>${fiscal||"_______________________________"}</div>
  <div class="sig-cell" style="font-size:7pt;"><strong>Emissão:</strong> ${emissao||"—"}<br/><strong>Projeto:</strong> ${projSel?.codigo||"—"}<br/><strong>Período:</strong> ${dtIni||"início"} a ${dtFim||"atual"}</div>
</div>
<div class="foot">SGLAA – Sistema de Gerenciamento Laboratorial de Asfalto · DNIT 031/2024-ES · Gerado em ${new Date().toLocaleString("pt-BR")}</div>

</div>
<script>setTimeout(()=>window.print(),450);<\/script>
</body></html>`;

    w.document.write(html);
    w.document.close();
  };

  // ── Interface de configuração do relatório ────────────────────────
  return(
    <div>
      <div style={{background:`linear-gradient(135deg,${T.blueB},${T.card})`,border:`1px solid ${T.blue}40`,borderRadius:8,padding:"12px 16px",marginBottom:14}}>
        <ST c={T.blue} size={13} mb={4}>📄 Gerador de Relatório</ST>
        <div style={{fontSize:11,color:T.dim}}>Configure os filtros, revise os dados e gere o PDF para entrega ao DNIT / arquivo interno</div>
      </div>

      {/* Filtros */}
      <Card style={{marginBottom:12}}>
        <ST c={T.accent} mb={10}>Filtros do Relatório</ST>
        <Row>
          <FL label="Projeto / Obra" style={{flex:1,minWidth:200}}>
            <select value={projFiltro} onChange={e=>setProjFiltro(e.target.value)}>
              <option value="todos">Todos os projetos</option>
              {projetos.map(p=><option key={p.id} value={p.id}>{p.codigo} – {p.nome.slice(0,30)}</option>)}
            </select>
          </FL>
          <FL label="Tipo de Ensaio" style={{flex:1,minWidth:180}}>
            <select value={tipoFiltro} onChange={e=>setTipoFiltro(e.target.value)}>
              <option value="todos">Todos os tipos</option>
              {tipos.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </FL>
          <FL label="Data Início" w="140px"><input type="date" value={dtIni} onChange={e=>setDtIni(e.target.value)}/></FL>
          <FL label="Data Fim" w="140px"><input type="date" value={dtFim} onChange={e=>setDtFim(e.target.value)}/></FL>
        </Row>
      </Card>

      {/* Dados do relatório */}
      <Card style={{marginBottom:12}}>
        <ST c={T.accent} mb={10}>Dados de Identificação do Relatório</ST>
        <Row>
          <FL label="Cliente / Obra" style={{flex:1}}><input value={obra} onChange={e=>setObra(e.target.value)} placeholder="Ex: EPR Sul de Minas – BR-381"/></FL>
          <FL label="Data de Emissão" w="150px"><input value={emissao} onChange={e=>setEmissao(e.target.value)}/></FL>
        </Row>
        <Row>
          <FL label="Técnico de Laboratório" style={{flex:1}}><input value={respTec} onChange={e=>setRespTec(e.target.value)}/></FL>
          <FL label="Engenheiro Responsável" style={{flex:1}}><input value={engResp} onChange={e=>setEngResp(e.target.value)}/></FL>
          <FL label="CREA" w="140px"><input value={creaEng} onChange={e=>setCreaEng(e.target.value)}/></FL>
          <FL label="Fiscal DNIT" style={{flex:1}}><input value={fiscal} onChange={e=>setFiscal(e.target.value)}/></FL>
        </Row>
        <FL label="Observações / Ressalvas">
          <textarea rows={2} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Condições de campo, não conformidades tratadas, etc."/>
        </FL>
      </Card>

      {/* Preview dos ensaios */}
      <Card style={{marginBottom:12}}>
        <ST c={T.accent} mb={8}>Preview — {filtrados.length} ensaio(s) selecionado(s)</ST>

        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:8,marginBottom:12}}>
          {[
            {l:"Total",v:total,c:T.text},
            {l:"Conformes",v:conf,c:T.green},
            {l:"Não Conf.",v:nc,c:nc>0?T.red:T.muted},
            {l:"Pendentes",v:total-conf-nc,c:T.accent},
            {l:"% Conf.",v:total?pctConf+"%":"—",c:pctConf>=90?T.green:pctConf>=70?T.accent:T.red},
          ].map(({l,v,c})=>(
            <div key={l} style={{background:T.surface,padding:"8px 10px",borderRadius:4,textAlign:"center"}}>
              <div style={{fontSize:9,color:T.muted,marginBottom:2}}>{l}</div>
              <div style={{fontFamily:"'Share Tech Mono'",fontSize:18,fontWeight:700,color:c}}>{v}</div>
            </div>
          ))}
        </div>

        {filtrados.length===0?(
          <div style={{color:T.muted,textAlign:"center",padding:20,fontSize:12}}>
            Nenhum ensaio encontrado para os filtros selecionados.<br/>
            <span style={{fontSize:11}}>Salve resultados nos módulos de ensaio (botão 💾 em cada aba).</span>
          </div>
        ):(
          <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Tipo</th><th>Projeto</th><th>Data</th><th>Trecho/Lote</th><th>Técnico</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {filtrados.map(e=>(
                  <tr key={e.id}>
                    <td style={{color:T.text,maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.tipo}</td>
                    <td style={{color:T.accent,fontSize:10}}>{e.projCodigo||"—"}</td>
                    <td style={{color:T.dim,whiteSpace:"nowrap"}}>{new Date(e.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td>
                    <td style={{color:T.dim}}>{e.trecho||e.lote||"—"}</td>
                    <td>{e.tecnico||"—"}</td>
                    <td>
                      <span className={`badge ${e.status==="CONFORME"?"conf":e.status==="NÃO CONFORME"?"nconf":"pend"}`}>
                        {e.status==="CONFORME"?"✓ CONF":e.status==="NÃO CONFORME"?"✗ NC":"◌ PEND"}
                      </span>
                    </td>
                    <td>
                      <button onClick={()=>{if(confirm("Excluir este registro?"))onDelete(e.id);}}
                        style={{background:T.redB,color:T.red,border:"none",borderRadius:3,padding:"2px 7px",fontSize:10,cursor:"pointer"}}>✕</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {/* Botão gerar */}
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:8,padding:16,textAlign:"center"}}>
        <div style={{fontSize:12,color:T.dim,marginBottom:10}}>
          O relatório abre em nova aba formatado para impressão/PDF · Inclui cabeçalho, KPIs, resultados por tipo de ensaio, limites do projeto e campos de assinatura
        </div>
        <button onClick={gerarPDF} style={{
          background:filtrados.length>0?T.accent:"#333",color:filtrados.length>0?T.bg:T.muted,
          padding:"11px 36px",fontSize:15,fontWeight:700,borderRadius:6,
          border:"none",cursor:filtrados.length>0?"pointer":"not-allowed",
          fontFamily:"'Rajdhani',sans-serif",letterSpacing:".06em"
        }}>
          📄 Gerar Relatório PDF
        </button>
        {filtrados.length===0&&<div style={{fontSize:10,color:T.red,marginTop:6}}>Nenhum ensaio para gerar relatório com os filtros atuais</div>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════════════
const TABS=[
  {id:"projetos",icon:"📋",label:"Projetos",    sub:"Dosagem"},
  {id:"extrgran",icon:"⬡", label:"Extração+Granu",sub:"DNIT 158+412"},
  {id:"rt",      icon:"◉", label:"Resist. Tração",sub:"DNIT 136"},
  {id:"marsh",   icon:"▦", label:"Rice+Marshall", sub:"DNIT 427+447"},
  {id:"equiv",   icon:"◎", label:"Equiv. Areia",  sub:"DNIT 450"},
  {id:"estat",   icon:"∑", label:"Ctrl. Estat.",  sub:"SPMAR/Anexo A"},
  {id:"relatorio",icon:"📄",label:"Relatório",   sub:"PDF / Imprimir"},
];

function App(){
  const [tab,setTab]=useState("projetos");
  const [projetos,setProjetos]=useState([]);
  const [projetoAtivo,setProjetoAtivo]=useState(null);
  const [editando,setEditando]=useState(null);
  const [criando,setCriando]=useState(false);
  const [loading,setLoading]=useState(true);
  const [ensaios,setEnsaios]=useState([]);

  const reloadEnsaios=useCallback(async()=>{
    const e=await sg(SK.ens)||[];
    setEnsaios(e);
  },[]);

  useEffect(()=>{
    Promise.all([sg(SK.proj),sg(SK.ens)]).then(([p,e])=>{
      if(p&&p.length){setProjetos(p);setProjetoAtivo(p[0]);}
      setEnsaios(e||[]);
      setLoading(false);
    });
  },[]);

  const salvarProjeto=async p=>{
    const exists=projetos.find(x=>x.id===p.id);
    const nova=exists?projetos.map(x=>x.id===p.id?p:x):[...projetos,p];
    setProjetos(nova);
    setProjetoAtivo(p);
    await ss(SK.proj,nova);
    setEditando(null);setCriando(false);
  };

  const excluirProjeto=async id=>{
    if(!confirm("Excluir este projeto?")) return;
    const nova=projetos.filter(p=>p.id!==id);
    setProjetos(nova);
    if(projetoAtivo?.id===id) setProjetoAtivo(nova[0]||null);
    await ss(SK.proj,nova);
  };

  if(loading) return <div style={{color:T.muted,textAlign:"center",padding:60}}>Carregando...</div>;

  return(
    <>
      <style>{CSS}</style>
      <div style={{maxWidth:1100,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column"}}>

        {/* Header */}
        <div style={{background:T.surface,borderBottom:`2px solid ${T.accent}25`,padding:"9px 14px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:200}}>
          <div style={{background:T.accent,width:34,height:34,borderRadius:5,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Rajdhani',sans-serif",fontWeight:800,fontSize:13,color:T.bg,flexShrink:0}}>SGLAA</div>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:16,color:T.text}}>Sistema de Gerenciamento Laboratorial — Asfalto</div>
            <div style={{fontSize:9,color:T.muted}}>DNIT 031/2024-ES · Cálculos automáticos · Limites por projeto de dosagem</div>
          </div>
          {/* Seletor de projeto ativo */}
          {projetos.length>0&&tab!=="projetos"&&(
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:9,color:T.muted}}>PROJETO ATIVO:</span>
              <select value={projetoAtivo?.id||""} onChange={e=>setProjetoAtivo(projetos.find(p=>p.id===e.target.value))}
                style={{fontSize:10,padding:"3px 6px",maxWidth:200}}>
                {projetos.map(p=><option key={p.id} value={p.id}>{p.codigo} – {p.nome.slice(0,20)}</option>)}
              </select>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,display:"flex",overflowX:"auto",position:"sticky",top:53,zIndex:190}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>{setTab(t.id);setEditando(null);setCriando(false);}} style={{
              flex:"0 0 auto",minWidth:95,padding:"8px 6px",background:"transparent",
              color:tab===t.id?T.accent:T.muted,border:"none",
              borderBottom:`2px solid ${tab===t.id?T.accent:"transparent"}`,
              display:"flex",flexDirection:"column",alignItems:"center",gap:2,
              fontFamily:"'Rajdhani',sans-serif",
            }}>
              <span style={{fontSize:16}}>{t.icon}</span>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:".04em"}}>{t.label}</span>
              <span style={{fontSize:8,color:T.muted}}>{t.sub}</span>
            </button>
          ))}
        </div>

        {/* Indicador projeto ativo (fora da aba projetos) */}
        {tab!=="projetos"&&projetoAtivo&&(
          <div style={{background:`${T.accent}10`,borderBottom:`1px solid ${T.accent}25`,padding:"5px 14px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:9,color:T.muted}}>📋 PROJETO:</span>
            <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:12,color:T.accent}}>{projetoAtivo.codigo}</span>
            <span style={{fontSize:11,color:T.dim}}>{projetoAtivo.nome}</span>
            <span style={{fontSize:10,color:T.muted}}>· Teor ótimo: <strong style={{color:T.accent}}>{projetoAtivo.teorcapOtimo}%</strong></span>
            <span style={{fontSize:10,color:T.muted}}>· Faixa: <strong style={{color:T.text}}>{projetoAtivo.faixaDNIT}</strong></span>
            <button onClick={()=>setTab("projetos")} style={{marginLeft:"auto",fontSize:9,color:T.accent,background:"transparent",border:`1px solid ${T.accent}40`,borderRadius:3,padding:"2px 7px"}}>trocar</button>
          </div>
        )}
        {tab!=="projetos"&&!projetoAtivo&&(
          <div style={{background:T.orangeB,borderBottom:`1px solid ${T.orange}30`,padding:"5px 14px",fontSize:10,color:T.orange}}>
            ⚠ Sem projeto ativo — os limites de controle não serão aplicados. <button onClick={()=>setTab("projetos")} style={{color:T.accent,background:"transparent",border:"none",textDecoration:"underline",cursor:"pointer",fontSize:10}}>Selecionar projeto</button>
          </div>
        )}

        {/* Content */}
        <div style={{flex:1,padding:"14px 12px 60px",overflowY:"auto"}} className="fade">

          {/* ─── PROJETOS ─── */}
          {tab==="projetos"&&(
            criando||editando
              ?<CadastroProjeto proj={editando||undefined} onSalvar={salvarProjeto} onCancelar={()=>{setEditando(null);setCriando(false);}}/>
              :<ListaProjetos projetos={projetos} projetoAtivo={projetoAtivo}
                  onSelecionar={p=>{setProjetoAtivo(p);setTab("extrgran");}}
                  onEditar={p=>{setEditando(p);}}
                  onNovo={()=>setCriando(true)}
                  onExcluir={excluirProjeto}/>
          )}

          {tab==="extrgran"&&(
            <Card>
              <ST c={T.accent} mb={12}>Extração + Granulometria — DNIT 158-ME + DNIT 412/2025-ME</ST>
              <ExtrGranuloCalc proj={projetoAtivo} onSaved={reloadEnsaios}/>
            </Card>
          )}
          {tab==="rt"&&(
            <Card>
              <ST c={T.accent} mb={12}>Resistência à Tração — DNIT 136/2018-ME</ST>
              <RTCalc proj={projetoAtivo}/>
            </Card>
          )}
          {tab==="marsh"&&(
            <Card>
              <ST c={T.accent} mb={12}>Rice + Marshall + Parâmetros Volumétricos — DNIT 427+447+449</ST>
              <MarshallCalc proj={projetoAtivo}/>
            </Card>
          )}
          {tab==="equiv"&&(
            <Card>
              <ST c={T.accent} mb={12}>Equivalente de Areia — DNIT 450-ME</ST>
              <EquivArCalc proj={projetoAtivo}/>
            </Card>
          )}
          {tab==="estat"&&(
            <Card>
              <ST c={T.accent} mb={12}>Controle Estatístico de Aceitação — Anexo A, DNIT 031/2024</ST>
              <EstatCalc proj={projetoAtivo} ensaios={ensaios} projetos={projetos}/>
            </Card>
          )}
          {tab==="relatorio"&&(
            <Relatorio projetos={projetos} ensaios={ensaios} projetoAtivo={projetoAtivo} onDelete={async(id)=>{await delEnsaio(id);reloadEnsaios();}}/>
          )}

          {/* Tabela referência rápida (só fora de projetos) */}
          {tab!=="projetos"&&(
            <details style={{marginTop:14}}>
              <summary style={{cursor:"pointer",fontSize:10,color:T.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",padding:"8px 12px",background:T.surface,borderRadius:6,border:`1px solid ${T.border}`}}>
                📋 Referência Rápida — Critérios DNIT 031/2024 Anexo E
              </summary>
              <Card style={{marginTop:4}}>
                <div style={{overflowX:"auto"}}>
                  <table>
                    <thead><tr><th>Parâmetro</th><th>Norma</th><th>Critério DNIT</th><th>Frequência</th></tr></thead>
                    <tbody>
                      {[
                        ["Equiv. Areia","DNIT 450-ME","≥55%","Semanal"],
                        ["Granulometria","DNIT 412-ME","Faixa trabalho","Cada 4h"],
                        ["Teor de CAP","DNIT 158-ME","±0,3% projeto","Cada 4h"],
                        ["RT","DNIT 136-ME","≥0,65 MPa","Diária"],
                        ["Dano por Umidade","DNIT 180-ME","≥0,70","Semanal"],
                        ["Vv","DNIT 449-PRO","3,0–5,0%","Dosagem"],
                        ["RBV","DNIT 449-PRO","65–75%","Dosagem"],
                        ["Estabilidade Marshall","DNIT 447-ME","≥500 kgf","Dosagem"],
                        ["Gmm Rice","DNIT 427-ME","Dif. entre det. ≤0,011","Cada 4h"],
                        ["Los Angeles","DNIT 451-ME","≤50%","Dosagem"],
                        ["Partíc. Fraturadas","DNIT 430-ME","≥90%","Dosagem"],
                        ["Absorção Agregado","DNIT 413-ME","≤2,0%","Dosagem"],
                      ].map(([p2,n2,c,f])=>(
                        <tr key={p2}><td style={{color:T.text}}>{p2}</td><td style={{color:T.blue}}>{n2}</td><td style={{color:T.accent}}>{c}</td><td style={{color:T.dim}}>{f}</td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </details>
          )}
        </div>
      </div>
    </>
  );
}


// Mount
const rootEl = document.getElementById("root");
const loadEl = document.getElementById("loading");
const root = ReactDOM.createRoot(rootEl);

try {
  root.render(React.createElement(App));
  rootEl.style.display = "block";
  loadEl.style.display = "none";
} catch(e) {
  document.getElementById("error").style.display = "flex";
  document.getElementById("error-msg").textContent = e.message;
  loadEl.style.display = "none";
  console.error(e);
}
</script>

<script>
  // Move app code to window variable so it loads after Firebase
  const src = document.getElementById("app-source").textContent;
  window.__APP_CODE__ = src;
  
  // Timeout de segurança
  setTimeout(function() {
    if (document.getElementById("loading").style.display !== "none") {
      document.getElementById("error").style.display = "flex";
      document.getElementById("error-msg").textContent = "Tempo esgotado. Verifique sua conexão com a internet.";
      document.getElementById("loading").style.display = "none";
    }
  }, 15000);
</script>
